<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1810"/>
      <stop offset="50%" stop-color="#4a2511"/>
      <stop offset="100%" stop-color="#1f0f08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca65"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b263e"/>
      <stop offset="100%" stop-color="#a8324e"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e4d38"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b07d2b"/>
      <stop offset="100%" stop-color="#d49a3d"/>
    </linearGradient>
    <linearGradient id="book4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a4365"/>
      <stop offset="100%" stop-color="#3182ce"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  
  <!-- Outer Arch Border (Library Aesthetic) -->
  <path d="M 96 420 L 96 200 C 96 112 168 48 256 48 C 344 48 416 112 416 200 L 416 420" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.4"/>
  
  <!-- Bookshelf -->
  <g filter="url(#shadow)">
    <!-- Shelf base -->
    <rect x="76" y="380" width="360" height="28" rx="4" fill="#5c2c16" stroke="#3d1d0e" stroke-width="2"/>
    <rect x="80" y="382" width="352" height="6" fill="#824623" opacity="0.6"/>
    <!-- Shelf brass brackets -->
    <rect x="96" y="408" width="16" height="24" fill="url(#gold)"/>
    <rect x="400" y="408" width="16" height="24" fill="url(#gold)"/>

    <!-- Book 1 (Leaning or standing) -->
    <rect x="115" y="190" width="48" height="190" rx="4" fill="url(#book1)"/>
    <line x1="123" y1="205" x2="123" y2="365" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
    <line x1="155" y1="205" x2="155" y2="365" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
    
    <!-- Book 2 -->
    <rect x="170" y="160" width="56" height="220" rx="4" fill="url(#book2)"/>
    <rect x="180" y="180" width="36" height="18" rx="2" fill="url(#gold)" opacity="0.9"/>
    <line x1="178" y1="220" x2="218" y2="220" stroke="#143324" stroke-width="2"/>
    <line x1="178" y1="340" x2="218" y2="340" stroke="#143324" stroke-width="2"/>

    <!-- Book 3 -->
    <rect x="233" y="140" width="62" height="240" rx="4" fill="url(#book3)"/>
    <circle cx="264" cy="180" r="14" fill="none" stroke="#684714" stroke-width="3"/>
    <path d="M 245 230 L 283 230 M 245 240 L 283 240 M 245 250 L 275 250" stroke="#fefae0" stroke-width="2" opacity="0.8"/>
    <!-- Bookmark ribbon hanging down -->
    <path d="M 260 380 L 260 415 L 267 408 L 274 415 L 274 380 Z" fill="#b91c1c"/>

    <!-- Book 4 -->
    <rect x="302" y="180" width="50" height="200" rx="4" fill="url(#book4)"/>
    <line x1="310" y1="195" x2="344" y2="195" stroke="url(#gold)" stroke-width="3"/>
    <line x1="310" y1="365" x2="344" y2="365" stroke="url(#gold)" stroke-width="3"/>

    <!-- Book 5 (tilted) -->
    <g transform="translate(365, 380) rotate(14) translate(-365, -380)">
      <rect x="358" y="195" width="46" height="185" rx="4" fill="#78350f"/>
      <line x1="366" y1="210" x2="396" y2="210" stroke="url(#gold)" stroke-width="2"/>
      <line x1="366" y1="365" x2="396" y2="365" stroke="url(#gold)" stroke-width="2"/>
    </g>
  </g>
</svg>
